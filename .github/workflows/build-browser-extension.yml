name: Build Browser Extension

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      version_code:
        required: true
        type: string
      artifact_slug:
        required: true
        type: string
      assembly_version:
        required: true
        type: string
      git_sha_short:
        required: true
        type: string
      extension_repo:
        required: false
        type: string
        default: ''
      extension_ref:
        required: false
        type: string
        # 不再回退到可变分支：传了 extension_repo 就必须同时传 40 位提交号（审计 F-09）。
        default: ''
      extension_kind:
        required: false
        type: string
        default: 'url'
      extension_browser:
        required: false
        type: string
        default: 'chrome'
  workflow_dispatch:
    inputs:
      version:
        description: 'Display version (empty = resolve locally for debug)'
        required: false
        default: ''
      version_code:
        required: false
        default: ''
      artifact_slug:
        required: false
        default: ''
      assembly_version:
        required: false
        default: ''
      git_sha_short:
        required: false
        default: ''
      extension_repo:
        description: 'Browser extension source repository'
        required: false
        default: ''
      extension_ref:
        description: 'Browser extension ref (must be a full 40-hex commit SHA)'
        required: false
        default: ''
      extension_kind:
        description: 'Extension kind: url (tracker-web) or site (time-tracker fork)'
        required: false
        default: 'url'
      extension_browser:
        description: 'Target browser: chrome (MV3) or firefox (MV2)'
        required: false
        default: 'chrome'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version if needed
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
            echo "artifact_slug=${{ inputs.artifact_slug }}" >> "$GITHUB_OUTPUT"
            echo "assembly_version=${{ inputs.assembly_version }}" >> "$GITHUB_OUTPUT"
            echo "git_sha_short=${{ inputs.git_sha_short }}" >> "$GITHUB_OUTPUT"
          else
            bash "$GITHUB_WORKSPACE/scripts/ci/resolve-version.sh"
          fi

      # 插件源码已随仓库拆分迁入本仓 browser-extension/（原 fork 仓 tracker-web）。
      # 只有显式指定 extension_repo 时才从外部仓检出，用于兼容仍未迁入的 fork。
      - name: Checkout browser extension source (external)
        if: inputs.extension_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.extension_repo }}
          ref: ${{ inputs.extension_ref }}
          path: .browser-extension-src

      # 外部仓必须固定到 40 位提交号，缺失或可变 ref 一律失败（审计 F-09）。
      - name: Require pinned ref for external browser extension source
        if: inputs.extension_repo != ''
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          case "${{ inputs.extension_ref }}" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *)
              echo "::error::extension_repo is set but extension_ref='${{ inputs.extension_ref }}' is not a 40-hex commit SHA"
              exit 1
              ;;
          esac
          # 检出后的 HEAD 必须真的等于这个提交号（只看输入值不足以证明检出的就是它）。
          actual="$(git -C "$GITHUB_WORKSPACE/.browser-extension-src" rev-parse HEAD)"
          if [ "$actual" != "${{ inputs.extension_ref }}" ]; then
            echo "::error::browser extension HEAD is $actual, expected ${{ inputs.extension_ref }}"
            exit 1
          fi

      - name: Use in-repo browser extension source
        if: inputs.extension_repo == ''
        shell: bash
        run: ln -sfn "$GITHUB_WORKSPACE/browser-extension" "$GITHUB_WORKSPACE/.browser-extension-src"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 产物目录与依赖安装方式在两个 fork 之间不同（tracker-web: build/ + lockfile；
      # time-tracker-4-browser: dist_prod/ 且上游不提交 lockfile），统一由自适应
      # 脚本处理并做产物校验。
      # #312：Chrome 与 Firefox 是两个独立产物——Firefox 无法运行 MV3 service
      # worker 构建，因此必须分别构建、分别校验、分别作为发布资产。
      - name: Test cross-platform packaging scripts
        working-directory: ${{ github.workspace }}
        run: |
          node --test scripts/ci/test-zip-writer.mjs
          node --test scripts/ci/test-verify-extension-zips.mjs
          node --test scripts/ci/test-site-reporter-guard.mjs

      - name: Install dependencies and build extension
        working-directory: ${{ github.workspace }}
        run: |
          # Chrome 保持原有资产名（pim-browser-extension-v*.zip）以兼容既有链接；
          # Firefox 增加 -firefox- 中缀，两者都落在 pim-browser-extension-*.zip 家族内。
          BROWSER="${{ inputs.extension_browser || 'chrome' }}"
          if [ "$BROWSER" = "firefox" ]; then
            ASSET="artifacts/pim-browser-extension-firefox-v${{ steps.ver.outputs.artifact_slug }}.zip"
          else
            ASSET="artifacts/pim-browser-extension-v${{ steps.ver.outputs.artifact_slug }}.zip"
          fi
          node scripts/ci/build-browser-extension.mjs \
            --src .browser-extension-src \
            --out artifacts/staging \
            --zip "$ASSET" \
            --kind ${{ inputs.extension_kind || 'url' }} \
            --browser "$BROWSER"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
        id: build

      # 规范归档自检：条目名不得含反斜杠、manifest 引用齐全、目标浏览器与版本一致（#312）。
      - name: Verify artifact
        run: |
          ls -lh artifacts/*.zip
          node "${{ github.workspace }}/scripts/ci/verify-extension-zips.mjs" \
            "${{ steps.build.outputs.asset }}:${{ inputs.extension_browser || 'chrome' }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          # 两个目标跑同一个可复用工作流，artifact 名必须区分，否则同名上传会互相覆盖。
          name: pim-browser-extension-${{ inputs.extension_browser || 'chrome' }}-v${{ steps.ver.outputs.artifact_slug }}
          path: artifacts/*.zip
          if-no-files-found: error
