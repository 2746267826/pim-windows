name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_all:
        description: Force all builds
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      version_code: ${{ steps.ver.outputs.version_code }}
      artifact_slug: ${{ steps.ver.outputs.artifact_slug }}
      assembly_version: ${{ steps.ver.outputs.assembly_version }}
      git_sha_short: ${{ steps.ver.outputs.git_sha_short }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
      is_release: ${{ steps.ver.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ver
        uses: ./.github/actions/resolve-version
        with:
          pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}

  build-windows:
    needs: [resolve-version]
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}
      # 空值 = 使用本仓 browser-extension/（原 fork 仓 tracker-web 已迁入）
      extension_repo: ''
      extension_ref: ''

  build-shell-windows:
    needs: [resolve-version]
    uses: ./.github/workflows/build-shell-windows.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}

  build-browser-extension:
    needs: [resolve-version]
    uses: ./.github/workflows/build-browser-extension.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}
      extension_repo: ''
      extension_ref: ''
      extension_kind: url
      extension_browser: chrome

  build-browser-extension-firefox:
    needs: [resolve-version]
    uses: ./.github/workflows/build-browser-extension.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}
      extension_repo: ''
      extension_ref: ''
      extension_kind: url
      extension_browser: firefox

  # 汇总门禁：任一子任务失败即整体失败，避免"看起来绿了"。
  # 客户端测试（跨平台部分）：守护程序核心逻辑，跑在 Linux 上。
  # 这些用例过去只存在于主仓、随拆仓变成无人执行的孤儿，现在接进 CI。
  test-client-core:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run cross-platform client tests
        run: dotnet test tests/Pim.Client.Tests/Pim.Client.Tests.csproj --logger "console;verbosity=minimal"

  # 客户端测试（Windows 专属部分）：依赖 WPF / WinForms 组件，只能在 Windows 上跑。
  test-client-app:
    needs: [resolve-version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Windows-only client tests
        run: dotnet test tests/Pim.Client.App.Tests/Pim.Client.App.Tests.csproj --logger "console;verbosity=minimal"


  # 契约新鲜度（required job）：只读校验，绝不写仓。
  # 事件面：push(master) / pull_request(master) / workflow_dispatch 全部真实执行；
  # 无 if:、无 continue-on-error、无路径过滤 —— 快照陈旧或取不到权威源一律 fail-closed，
  # 不因「不是 PR」而放行（master 上的静默漂移正是最需要拦的场景）。
  # 刷新入口是 scripts/ci/refresh-contract.sh（人工：快照 + 生成物同批），CI 只调只读 check。
  contract-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 行为测试里的「旧 master 无 freshness 入口」负对照读的是
          # scripts/ci/test-contract-freshness.sh 里 BASE_REF 指向的**固定历史提交**
          # （引入本门禁之前的 master），因此必须保留完整历史；
          # 改小 fetch-depth 会让该对象不可达 → 负对照失效（CI 下按 fail-closed 判失败）。
          fetch-depth: 0

      # 显式准备 python：check / fetch 用 python3 校验 payload 与 provenance；
      # 行为测试还需要 PyYAML 从真实 ci.yml 原样抽取 step 与 gate 检查函数。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python dependencies for contract checks
        run: python3 -m pip install --disable-pip-version-check --quiet PyYAML

      # 先跑离线目标行为测试（本机 git 上游 + 本机 HTTP raw 源），再跑默认真实上游 check。
      - name: Contract freshness behavior tests (offline fixtures)
        run: |
          set -euo pipefail
          bash scripts/ci/test-contract-freshness.sh

      # 契约同步（pim-api#415）：自动刷新 → 提交 → 推分支 → 开 PR 的那一步。
      # 它错了不会报错，只会"PR 开不出来"或"开出来被 pr-metadata 拦下"，
      # 所以这里必须跑（真 git fixture + stub gh，离线）。
      - name: Contract sync behaviour tests (offline fixtures)
        run: |
          set -euo pipefail
          bash scripts/ci/test-contract-sync-pr.sh

      # 不设任何 PIM_CONTRACT_* env：走默认真实上游，无跨仓覆盖、无本地权威源旁路。
      - name: Verify contract snapshot is up to date (real upstream)
        run: |
          set -euo pipefail
          bash scripts/ci/check-contract-freshness.sh
          echo "✅ contract/openapi.json 与 contract/provenance.json 均与 pim-api 当前上游一致"


  # 契约生成物（required job）：客户端接口边界的第二道门禁。
  # 事件面与 contract-freshness 相同：push(master) / pull_request / workflow_dispatch 全部真实执行；
  # 无 if:、无 continue-on-error、无路径过滤。
  #
  # 两道门禁的分工：
  #   * 本 job —— 生成物一致性：用仓内快照重新生成一次，与仓内产物**逐字节比对**；
  #     契约变了而生成物没重生成、或有人手工改了生成物，一律 fail-closed。
  #   * test-client-core / build-windows —— 类型约束：C# 编译器按生成类型编译，
  #     编造端点/字段/枚举值（tests/ClientWindows/ContractBoundaryTests.cs 也在其中）直接编译失败。
  # 离线：只用 python3 标准库，不联网、不装依赖。
  contract-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 行为测试用 PyYAML 从真实 ci.yml 原样抽取 step 与 gate 检查函数（与 contract-freshness 一致）。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python dependencies for contract artifact checks
        run: python3 -m pip install --disable-pip-version-check --quiet PyYAML

      # 先跑门禁自身的行为测试（离线 fixtures + 负对照），再跑默认真实仓 check。
      - name: Contract C# gate behavior tests (offline)
        run: |
          set -euo pipefail
          bash scripts/ci/test-contract-csharp.sh

      - name: Verify contract-generated C# artifacts are up to date
        run: |
          set -euo pipefail
          bash scripts/ci/check-contract-csharp.sh
          echo "✅ ContractModels.cs / ContractOperations.cs 与 contract/openapi.json 逐字节一致"


  # 发版纯逻辑（资产归一化 + version.json）在 PR 上就跑一次：
  # 审计 F-06 —— 这段逻辑以前内联在 release job 里，PR 上恒为 skipped，
  # 抽成脚本后可以在没有发布权限的情况下真实执行与测试。
  release-assets:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test release asset logic
        run: bash scripts/ci/test-release-assets.sh

      # 发版脚本本身不许自证：改了生产脚本就必须让行为测试变红。
      - name: Release logic is not self-certifying
        run: bash scripts/ci/check-release-logic-tested.sh

  # 审计 F-12：浏览器插件的 Prettier 检查必须挂在**根** workflow 的 pull_request 上。
  # 原先它写在 browser-extension/.github/workflows/lint.yml —— 嵌套目录 GitHub 永不执行，
  # 等于没有任何风格门禁（该文件已删除，逻辑迁到这里）。
  browser-extension-lint:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json

      - name: Install browser extension dependencies
        working-directory: browser-extension
        run: npm ci

      # 真实执行：browser-extension 下出现任何 Prettier 违规都会让这一步非 0
      # （已在本地用一处真实违规验证过退出码 1）。
      - name: Prettier check
        working-directory: browser-extension
        run: npx prettier --check .

  # 审计 F-12：CodeQL 从嵌套目录迁入根 workflow，PR 与 push 都分析。
  # fork PR 拿不到 security-events: write，所以 analyze 的 upload 在 fork 上是 never，
  # 同仓 PR 与 master 是 always。不跳过整个 job，也不改用会给 fork 写权限的 target 触发。
  # 是否已成为 GitHub 上的 required check 由 ruleset 决定，本仓不修改 ruleset。
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'never' || 'always' }}

  # 审计 F-12 / AC-COM-05：job 在全部 event 上运行。
  # pull_request 校验真实标题、四段正文和分支名。
  # push / schedule / workflow_dispatch 没有 PR body，步骤自身 exit 0。
  # 结果必须是 success 才放行 gate 和 release，不靠 job skip。
  # 不回写历史 PR，不改 ruleset。
  pr-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check PR title, body sections and branch name
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/ci/check-pr-metadata.mjs

  gate:
    name: CI Gate
    needs: [resolve-version, build-windows, build-shell-windows, build-browser-extension, build-browser-extension-firefox, test-client-core, test-client-app, contract-freshness, contract-generated, release-assets, browser-extension-lint, pr-metadata, codeql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        env:
          R_RESOLVE: ${{ needs.resolve-version.result }}
          R_WINDOWS: ${{ needs.build-windows.result }}
          R_SHELL: ${{ needs.build-shell-windows.result }}
          R_EXT_CHROME: ${{ needs.build-browser-extension.result }}
          R_EXT_FIREFOX: ${{ needs.build-browser-extension-firefox.result }}
          R_TEST_CORE: ${{ needs.test-client-core.result }}
          R_TEST_APP: ${{ needs.test-client-app.result }}
          R_CONTRACT: ${{ needs.contract-freshness.result }}
          R_CONTRACT_GENERATED: ${{ needs.contract-generated.result }}
          R_RELEASE_ASSETS: ${{ needs.release-assets.result }}
          R_EXT_LINT: ${{ needs.browser-extension-lint.result }}
          R_PR_METADATA: ${{ needs.pr-metadata.result }}
          R_CODEQL: ${{ needs.codeql.result }}
        run: |
          set -uo pipefail
          fail=0
          check () {
            local label="$1" result="$2"
            if [ "$result" = "success" ]; then
              echo "✅ $label — success"
            else
              echo "❌ $label — ${result:-<missing>}"
              fail=1
            fi
          }
          check "resolve-version" "$R_RESOLVE"
          check "build-windows" "$R_WINDOWS"
          check "build-shell-windows" "$R_SHELL"
          check "build-browser-extension" "$R_EXT_CHROME"
          check "build-browser-extension-firefox" "$R_EXT_FIREFOX"
          check "test-client-core" "$R_TEST_CORE"
          check "test-client-app" "$R_TEST_APP"
          check "contract-freshness" "$R_CONTRACT"
          check "contract-generated" "$R_CONTRACT_GENERATED"
          check "release-assets" "$R_RELEASE_ASSETS"
          check "browser-extension-lint" "$R_EXT_LINT"
          check "pr-metadata" "$R_PR_METADATA"
          check "codeql" "$R_CODEQL"

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "::error::CI Gate 未通过：存在失败或未产生结果的必需 job。"
            exit 1
          fi
          echo ""
          echo "CI Gate 通过：所有必需 job 均成功。"

  # 发版：打 tag 时发布客户端/壳/安装器 + version.json。
  # version.json 是客户端更新检查的数据源，读取用 release 的稳定直链：
  #   https://github.com/<owner>/<repo>/releases/latest/download/version.json
  release:
    # 合并到 master 就发版（与 pim-api 一致）。原先写成 tag 触发，但拆仓后
    # 「每次合并 = 一个版本」是既定口径，tag 由 gh release create 自动创建。
    # 构建失败时不发版；PR 时 is_release 为 false，自然跳过。
    if: |
      always() &&
      needs.resolve-version.outputs.is_release == 'true' &&
      needs.contract-freshness.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'skipped') &&
      !contains(needs.*.result, 'cancelled')
    needs: [resolve-version, contract-freshness, build-windows, build-shell-windows, build-browser-extension, build-browser-extension-firefox, test-client-core, test-client-app, release-assets, browser-extension-lint, pr-metadata, codeql, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Normalize assets and generate version.json
        run: |
          bash scripts/ci/build-release-assets.sh \
            --version "${{ needs.resolve-version.outputs.version }}" \
            --tag "${{ needs.resolve-version.outputs.release_tag }}" \
            --repository "${{ github.repository }}" \
            --dist dl \
            --out out \
            --allow-missing-installer
          echo "--- version.json ---"
          cat out/version.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 每个 step 是独立进程：上一步定义的 shell 变量不会带过来，
          # 这里用到的 TAG 必须在本步重新声明（此前漏了 -> TAG: unbound variable）。
          V="${{ needs.resolve-version.outputs.version }}"
          TAG="${{ needs.resolve-version.outputs.release_tag }}"
          gh release create "$TAG" out/* \
            --repo "${{ github.repository }}" \
            --title "PIM Windows $TAG" \
            --generate-notes

      - name: Summary
        if: always()
        run: |
          {
            echo "### 发版 ${{ needs.resolve-version.outputs.release_tag }}"
            echo ""
            echo "| 资产 | 说明 |"
            echo "| --- | --- |"
            echo "| pim-windows-v${{ needs.resolve-version.outputs.version }}.zip | Windows 守护程序 |"
            echo "| pim-shell-windows-v${{ needs.resolve-version.outputs.version }}.zip | Windows 壳 |"
            echo "| PIM-Setup-v${{ needs.resolve-version.outputs.version }}.exe | 安装器（若有） |"
            echo "| version.json | 更新检查数据源 |"
          } >> "$GITHUB_STEP_SUMMARY"

