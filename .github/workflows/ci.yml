name: CI

on:
  push:
    branches: [master]
  # 触发修复（stacked gate PR 0 runs）：原先 pull_request 只匹配 base=master，
  # 而本门禁 PR 的 base 是产品分支（stacked），于是**永远不触发**。
  # 取消 PR 目标分支过滤 = 所有 PR 目标都触发；push 仍然只限 master，
  # permissions / gate 必需 job / release 条件全部不变。
  pull_request:
  # 审计 F-22：手动触发只用于演练/排查，不产生发布。原先还声明了 `force_all`
  # 这个输入，但整个工作流从不读取它 —— 已删除（死参数）。
  workflow_dispatch:
  # 审计 F-12：CodeQL 静态扫描随根 workflow 一起跑，并保留每周一次的完整扫描。
  # schedule 事件下 is_release=false（resolve-version 只认 push 到 master），不会误发版。
  schedule:
    - cron: '25 4 * * 3'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      version_code: ${{ steps.ver.outputs.version_code }}
      artifact_slug: ${{ steps.ver.outputs.artifact_slug }}
      assembly_version: ${{ steps.ver.outputs.assembly_version }}
      git_sha_short: ${{ steps.ver.outputs.git_sha_short }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
      is_release: ${{ steps.ver.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ver
        uses: ./.github/actions/resolve-version
        with:
          pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}

  build-windows:
    needs: [resolve-version]
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}
      # 空值 = 使用本仓 browser-extension/（原 fork 仓 tracker-web 已迁入）
      extension_repo: ''
      extension_ref: ''

  build-shell-windows:
    needs: [resolve-version]
    uses: ./.github/workflows/build-shell-windows.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}

  build-browser-extension:
    needs: [resolve-version]
    uses: ./.github/workflows/build-browser-extension.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}
      extension_repo: ''
      extension_ref: ''
      extension_kind: url
      extension_browser: chrome

  build-browser-extension-firefox:
    needs: [resolve-version]
    uses: ./.github/workflows/build-browser-extension.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}
      extension_repo: ''
      extension_ref: ''
      extension_kind: url
      extension_browser: firefox

  # 汇总门禁：任一子任务失败即整体失败，避免"看起来绿了"。
  # 客户端测试（跨平台部分）：守护程序核心逻辑，跑在 Linux 上。
  # 这些用例过去只存在于主仓、随拆仓变成无人执行的孤儿，现在接进 CI。
  test-client-core:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run cross-platform client tests
        run: dotnet test tests/Pim.Client.Tests/Pim.Client.Tests.csproj --logger "console;verbosity=minimal"

  # 客户端测试（Windows 专属部分）：依赖 WPF / WinForms 组件，只能在 Windows 上跑。
  #
  # 真实 Web bundle 联调前置（运行期 glue，不是产品逻辑）：
  # Harness_RealWebView2_LoadsActualWebDistAndEstablishesHostSessionChain 需要真实 web dist，
  # 缺 dist 时该用例 fail-closed（不 skip、不删断言、不伪造产物）。本 job 因此：
  #   1) 以**字面 40 位 SHA** pin 检出 pim-web 产品分支 head（不浮动 master、不用 placeholder）；
  #   2) 核对检出后的 HEAD 必须等于该 40 位 SHA；
  #   3) 用 pin 住的 lockfile npm ci 并构建真实 dist；
  #   4) 记录 dist 内容 hash 与来源 SHA；
  #   5) 把 dist 路径以 PIM_WEB_DIST_DIR 传给 test-client-app。
  test-client-app:
    needs: [resolve-version]
    runs-on: windows-latest
    env:
      # pim-web PR#6（产品：typed client / native host session / ICS）真实 head。
      PIM_WEB_PIN_SHA: 489a9dd6f11ebb045a47ef2a0599bd7c8a102b44
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned pim-web (products head, literal 40-char SHA)
        uses: actions/checkout@v4
        with:
          repository: 2746267826/pim-web
          ref: 489a9dd6f11ebb045a47ef2a0599bd7c8a102b44
          path: .pim-web
          persist-credentials: false

      - name: Verify checked-out HEAD is exactly the pinned 40-char SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C "$GITHUB_WORKSPACE/.pim-web" rev-parse HEAD)"
          echo "pim-web pinned source SHA: $actual"
          if [ "$actual" != "$PIM_WEB_PIN_SHA" ]; then
            echo "::error::pim-web checkout HEAD $actual != pinned $PIM_WEB_PIN_SHA"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .pim-web/client-web/package-lock.json

      - name: Install web dependencies from the pinned lockfile
        working-directory: .pim-web/client-web
        run: npm ci

      - name: Build the real web dist consumed by the Windows harness
        working-directory: .pim-web/client-web
        run: npm run build

      - name: Record dist hash and source SHA
        shell: bash
        run: |
          set -euo pipefail
          test -f .pim-web/client-web/dist/index.html
          DIST_INDEX_SHA256="$(sha256sum .pim-web/client-web/dist/index.html | cut -d' ' -f1)"
          {
            echo "pim_web_source_sha=$PIM_WEB_PIN_SHA"
            echo "pim_web_dist_dir=$GITHUB_WORKSPACE/.pim-web/client-web/dist"
            echo "pim_web_dist_index_sha256=$DIST_INDEX_SHA256"
            echo "windows_runner_image=${ImageName:-unknown}"
            echo "windows_runner_image_version=${ImageVersion:-unknown}"
            echo "windows_runner_os=${ImageOS:-unknown}"
            echo "merge_commit_sha=${GITHUB_SHA}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # runner 明确指定诊断阶段日志目录（落在 always-upload 的产物目录内）。
      # 目录不可用 → 夹具的 PhaseLog.Open() 直接抛（fail-closed），
      # 绝不出现「没有阶段证据却被读成通过」。
      - name: Run Windows-only client tests against the real web dist
        env:
          PIM_WEB_DIST_DIR: ${{ github.workspace }}/.pim-web/client-web/dist
          PIM_PHASE_LOG_DIR: ${{ github.workspace }}/TestResults/client-app/phases
        run: dotnet test tests/Pim.Client.App.Tests/Pim.Client.App.Tests.csproj --logger "console;verbosity=normal" --logger "trx;LogFileName=client-app.trx" --results-directory TestResults/client-app --diag TestResults/client-app/vstest.log --blame

      # 设施准入检查（脱敏）：逐行验证新增阶段日志的固定 schema，并扫描
      # canary / Authorization / Bearer / cookie / 页面正文。发现泄漏即 FAIL。
      # 只扫描本次新增的 phases/*.log；既有 console/TRX 里 Assert.Equal 失败时
      # 本就会显示 canary，不拿它当新增日志的安全证明（两者分开判读）。
      - name: Verify phase-log facility is on disk, schema-valid and secret-free
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          PHASES="$PIM_PHASE_LOG_DIR"
          echo "phase dir: $PHASES"
          echo "runner image: ${ImageName:-unknown} ${ImageOS:-unknown}"
          ls -la "$PHASES" 2>&1 || echo "phase dir missing"
          count=$(find "$PHASES" -maxdepth 1 -name '*.log' 2>/dev/null | wc -l)
          echo "phase log files: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::没有产生任何阶段日志：诊断设施未生效，本轮不能作为定位证据"
            exit 1
          fi
          bad=0
          for f in "$PHASES"/*.log; do
            # 固定字段 schema：s=1 pid= f= q= ts= tid= apt= cur= ev= fl= n1= n2= [xt=]
            if ! grep -Eqv '^s=1 pid=-?[0-9]+ f=[0-9a-f]{8} q=[0-9]+ ts=-?[0-9]+ tid=[0-9]+ apt=[0-3] cur=-?[0-9]+ ev=[0-9]+ fl=-?[0-9]+ n1=-?[0-9]+ n2=-?[0-9]+( xt=[A-Za-z0-9_.+]{0,160})?$' "$f"; then
              echo "::error::阶段日志行不符合固定 schema：$f"
              grep -Ev '^s=1 pid=-?[0-9]+ f=[0-9a-f]{8} q=[0-9]+ ts=-?[0-9]+ tid=[0-9]+ apt=[0-3] cur=-?[0-9]+ ev=[0-9]+ fl=-?[0-9]+ n1=-?[0-9]+ n2=-?[0-9]+( xt=[A-Za-z0-9_.+]{0,160})?$' "$f" | head -5
              bad=1
            fi
          done
          if grep -Eqi 'ACCESS-CANARY|REFRESH-CANARY|Bearer|Authorization|__pimToken|token\.json|127\.0\.0\.1|sessionStorage|localStorage|document\.cookie' "$PHASES"/*.log; then
            echo "::error::阶段日志疑似包含凭据/页面内容/地址"
            grep -Ein 'ACCESS-CANARY|REFRESH-CANARY|Bearer|Authorization|__pimToken|token\.json|127\.0\.0\.1|sessionStorage|localStorage|document\.cookie' "$PHASES"/*.log | head -10
            bad=1
          fi
          # 落盘证据：每个文件最后一条 = 进程被杀时仍留在磁盘上的最后标记。
          for f in "$PHASES"/*.log; do
            echo "last marker $(basename "$f"): $(tail -n 1 "$f")"
            echo "lines $(basename "$f"): $(wc -l < "$f")"
          done
          if [ "$bad" -ne 0 ]; then
            echo "::error::阶段日志设施检查未通过"
            exit 1
          fi
          echo "phase-log facility checks passed"

      - name: Preserve client test diagnostics even on abort
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-client-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/client-app/
          if-no-files-found: warn
          retention-days: 3


  # 发版纯逻辑（资产归一化 + version.json）在 PR 上就跑一次：
  # 审计 F-06 —— 这段逻辑以前内联在 release job 里，PR 上恒为 skipped，
  # 抽成脚本后可以在没有发布权限的情况下真实执行与测试。
  release-assets:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test release asset logic
        run: bash scripts/ci/test-release-assets.sh

  # 审计 F-12：浏览器插件的 Prettier 检查必须挂在**根** workflow 的 pull_request 上。
  # 原先它写在 browser-extension/.github/workflows/lint.yml —— 嵌套目录 GitHub 永不执行，
  # 等于没有任何风格门禁（该文件已删除，逻辑迁到这里）。
  browser-extension-lint:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json

      - name: Install browser extension dependencies
        working-directory: browser-extension
        run: npm ci

      # 真实执行：browser-extension 下出现任何 Prettier 违规都会让这一步非 0
      # （已在本地用一处真实违规验证过退出码 1）。
      - name: Prettier check
        working-directory: browser-extension
        run: npx prettier --check .

  # 审计 F-12：CodeQL 从嵌套目录迁入根 workflow，PR 与 push 都分析。
  # fork PR 拿不到 security-events: write，所以 analyze 的 upload 在 fork 上是 never，
  # 同仓 PR 与 master 是 always。不跳过整个 job，也不改用会给 fork 写权限的 target 触发。
  # 是否已成为 GitHub 上的 required check 由 ruleset 决定，本仓不修改 ruleset。
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'never' || 'always' }}

  # 审计 REQ-COM-03 / AC-COM-03：契约快照相对权威 pim-api 的新鲜度。
  # 需要网络（公有 raw.githubusercontent.com），不需要凭据；不手改 JSON 契约。
  contract-freshness:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check contract snapshot freshness
        run: bash scripts/ci/check-contract-freshness.sh

  # 本仓自己的 CI 守卫与故障对照：守卫本身也必须进 gate，否则“CI 门禁”只是文档。
  # F-11 的产品实现落地后这里**不再有任何 --exclude**：11 项检查全部直接跑，
  # 包括 webview-token-policy（round7 删除了 round3…round6 的临时隔离）。
  ci-scripts:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit guards
        run: node scripts/ci/check-audit-guards.mjs

      - name: Audit guard fault contrast
        run: node scripts/ci/test-audit-guards.mjs

      - name: CI script unit tests
        run: node --test scripts/ci/test-*.mjs

      - name: Release logic is not self-certifying
        run: bash scripts/ci/check-release-logic-tested.sh

      - name: Resolve version behavior tests
        run: bash scripts/ci/test-resolve-version.sh

      - name: Contract freshness behavior tests
        run: bash scripts/ci/test-contract-freshness.sh

  # 审计 F-12 / AC-COM-05：job 在全部 event 上运行。
  # pull_request 校验真实标题、四段正文和分支名。
  # push / schedule / workflow_dispatch 没有 PR body，步骤自身 exit 0。
  # 结果必须是 success 才放行 gate 和 release，不靠 job skip。
  # 不回写历史 PR，不改 ruleset。
  pr-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check PR title, body sections and branch name
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/ci/check-pr-metadata.mjs

  gate:
    name: CI Gate
    needs: [resolve-version, build-windows, build-shell-windows, build-browser-extension, build-browser-extension-firefox, test-client-core, test-client-app, release-assets, browser-extension-lint, contract-freshness, ci-scripts, pr-metadata, codeql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        env:
          R_RESOLVE: ${{ needs.resolve-version.result }}
          R_WINDOWS: ${{ needs.build-windows.result }}
          R_SHELL: ${{ needs.build-shell-windows.result }}
          R_EXT_CHROME: ${{ needs.build-browser-extension.result }}
          R_EXT_FIREFOX: ${{ needs.build-browser-extension-firefox.result }}
          R_TEST_CORE: ${{ needs.test-client-core.result }}
          R_TEST_APP: ${{ needs.test-client-app.result }}
          R_RELEASE_ASSETS: ${{ needs.release-assets.result }}
          R_EXT_LINT: ${{ needs.browser-extension-lint.result }}
          R_CONTRACT: ${{ needs.contract-freshness.result }}
          R_CI_SCRIPTS: ${{ needs.ci-scripts.result }}
          R_PR_METADATA: ${{ needs.pr-metadata.result }}
          R_CODEQL: ${{ needs.codeql.result }}
        run: |
          set -uo pipefail
          fail=0
          check () {
            local label="$1" result="$2"
            if [ "$result" = "success" ]; then
              echo "✅ $label — success"
            else
              echo "❌ $label — ${result:-<missing>}"
              fail=1
            fi
          }
          check "resolve-version" "$R_RESOLVE"
          check "build-windows" "$R_WINDOWS"
          check "build-shell-windows" "$R_SHELL"
          check "build-browser-extension" "$R_EXT_CHROME"
          check "build-browser-extension-firefox" "$R_EXT_FIREFOX"
          check "test-client-core" "$R_TEST_CORE"
          check "test-client-app" "$R_TEST_APP"
          check "release-assets" "$R_RELEASE_ASSETS"
          check "browser-extension-lint" "$R_EXT_LINT"
          check "contract-freshness" "$R_CONTRACT"
          check "ci-scripts" "$R_CI_SCRIPTS"
          check "pr-metadata" "$R_PR_METADATA"
          check "codeql" "$R_CODEQL"

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "::error::CI Gate 未通过：存在失败或未产生结果的必需 job。"
            exit 1
          fi
          echo ""
          echo "CI Gate 通过：所有必需 job 均成功。"

  # 发版：打 tag 时发布客户端/壳/安装器 + version.json。
  # version.json 是客户端更新检查的数据源，读取用 release 的稳定直链：
  #   https://github.com/<owner>/<repo>/releases/latest/download/version.json
  release:
    # 合并到 master 就发版（与 pim-api 一致）。原先写成 tag 触发，但拆仓后
    # 「每次合并 = 一个版本」是既定口径，tag 由 gh release create 自动创建。
    # 审计 F-05：release 必须依赖**全部**必需 job 与聚合门禁 gate，
    # 并且 failure / skipped / cancelled 任一结果都不得发版。
    # （is_release 已收紧为「push 到 master」，见 scripts/ci/resolve-version.sh。）
    if: |
      always() &&
      needs.resolve-version.outputs.is_release == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'skipped') &&
      !contains(needs.*.result, 'cancelled')
    needs: [resolve-version, build-windows, build-shell-windows, build-browser-extension, build-browser-extension-firefox, test-client-core, test-client-app, release-assets, browser-extension-lint, contract-freshness, ci-scripts, codeql, pr-metadata, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Normalize assets and generate version.json
        run: |
          bash scripts/ci/build-release-assets.sh \
            --version "${{ needs.resolve-version.outputs.version }}" \
            --tag "${{ needs.resolve-version.outputs.release_tag }}" \
            --repository "${{ github.repository }}" \
            --dist dl \
            --out out \
            --allow-missing-installer
          echo "--- version.json ---"
          cat out/version.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 每个 step 是独立进程：上一步定义的 shell 变量不会带过来，
          # 这里用到的 TAG 必须在本步重新声明（此前漏了 -> TAG: unbound variable）。
          V="${{ needs.resolve-version.outputs.version }}"
          TAG="${{ needs.resolve-version.outputs.release_tag }}"
          gh release create "$TAG" out/* \
            --repo "${{ github.repository }}" \
            --title "PIM Windows $TAG" \
            --generate-notes

      - name: Summary
        if: always()
        run: |
          {
            echo "### 发版 ${{ needs.resolve-version.outputs.release_tag }}"
            echo ""
            echo "| 资产 | 说明 |"
            echo "| --- | --- |"
            echo "| pim-windows-v${{ needs.resolve-version.outputs.version }}.zip | Windows 守护程序 |"
            echo "| pim-shell-windows-v${{ needs.resolve-version.outputs.version }}.zip | Windows 壳 |"
            echo "| PIM-Setup-v${{ needs.resolve-version.outputs.version }}.exe | 安装器（若有） |"
            echo "| version.json | 更新检查数据源 |"
          } >> "$GITHUB_STEP_SUMMARY"

