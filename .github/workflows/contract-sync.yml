name: Contract sync

# 契约同步接收端（对应 pim-api#415 方案 A）。
#
# pim-api 在 master 上检测到 contract/openapi.json 变化、且契约通过了它的硬校验后，
# 会向本仓发 repository_dispatch（event_type: contract-updated）。这里收到后：
#   1) 按通知里带的不可变 ref 取契约字节（不是"取当时的 master"，避免刷出与通知不符的快照）；
#   2) 一步到底地刷新：快照 + provenance（将来本仓引入契约生成物后，生成步骤必须一并绑进来）；
#   3) 用 GitHub App 的 installation token 推分支、开一个**需要人工 review** 的 PR。
#
# 为什么用 App token 而不是默认 GITHUB_TOKEN：
#   GitHub 的防递归机制规定「用 GITHUB_TOKEN 推的分支不会再触发后续工作流」，
#   刷新 PR 上会没有任何检查结果，而本仓要求 CI 绿才能合（何况本仓还有 pr-metadata 门禁，
#   它只在 PR 事件上真的校验标题/正文/分支名）。App token 是另一个身份，推送会正常触发 CI。
#
# 自动开的 PR 必须能过本仓的 pr-metadata 门禁：分支名 {agent}-{os}/{topic}、
# 标题中英双语、正文含四个双语章节 —— 这三条由 scripts/ci/contract-sync-pr.sh 生成，
# 并且可以用仓内真实的 scripts/ci/check-pr-metadata.mjs 离线复核。
#
# 幂等与安全：刷出来没有差异就不产生提交、不动 PR；通知里的 sha256 对不上则失败退出。

on:
  repository_dispatch:
    types: [contract-updated]
  # 手动补跑：pim-api 的通知没收到、或需要在测试分支上验证本链路时用。
  workflow_dispatch:
    inputs:
      contract_ref:
        description: 'pim-api ref（40 位 SHA / 分支 / tag）。留空 = master'
        required: false
        default: ''
        type: string
      contract_sha256:
        description: '期望的快照 sha256（可选；不一致即失败，不提交、不开 PR）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# 同一个仓同一时刻只跑一个契约同步：两个 run 同时改同一条分支会互相踩。
concurrency:
  group: contract-sync
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh contract snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Create contract-sync token (GitHub App installation token)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PIM_CONTRACT_SYNC_APP_ID }}
          private-key: ${{ secrets.PIM_CONTRACT_SYNC_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # 用 App token checkout：推分支要用它，且不允许回落到默认 GITHUB_TOKEN。
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 刷新 → 提交 → 推分支 → 开 PR 都在脚本里一步到底，且只刷一次：
      # --contract-ref 交给刷新脚本，避免"刷完又被默认 master 覆盖一次"。
      - name: Refresh and open / update the refresh PR
        env:
          # token 只经环境变量传给脚本：不进 argv、不落盘、不回显。
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA256: ${{ github.event.client_payload.sha256 || inputs.contract_sha256 || '' }}
          CONTRACT_REF: ${{ github.event.client_payload.ref || inputs.contract_ref || 'master' }}
        run: |
          set -euo pipefail
          echo "契约来源 ref：$CONTRACT_REF"
          ARGS=()
          if [ -n "$SHA256" ]; then ARGS+=(--payload-sha256 "$SHA256"); fi
          bash scripts/ci/contract-sync-pr.sh --contract-ref "$CONTRACT_REF" "${ARGS[@]}"
